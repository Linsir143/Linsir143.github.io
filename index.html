<!DOCTYPE html>

<head>

    <title>Γ 的个人网站</title>
    <meta name="description" content="Γ 的个人网站，主要记录关于数学的个人见解。">

    <meta id="site-metadata" data-app-name="gamma-personal-website">

    <!-- Custom CSS Stylesheet (includes custom syntax highlighting) -->

<body class="dark-mode"> <!-- Default to Dark Mode for premium look -->

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Header / Navigation -->
    <header class="navbar" id="site-header">
        <div class="nav-container">
            <a href="#/" class="logo">
                <span class="logo-symbol">Γ</span>
                <span class="logo-text">Γ 的个人网站</span>

            <nav class="nav-menu" id="nav-menu">
                <a href="#/" class="nav-link active" data-route=""><i class="fa-solid fa-house"></i> 首页</a>

                <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="移动端菜单">
                    <i class="fa-solid fa-bars"></i>
